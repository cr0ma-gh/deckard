# The live image user. Created by systemd-sysusers when archiso installs the
# packages; uid/gid 1000 match the ownership set in profiledef.overrides.sh.
# The group must be declared first: "u deck 1000:1000" needs GID 1000 to exist.
g deck 1000
u deck 1000:1000 "Deckard" /home/deck /bin/bash
m deck wheel
m deck video
m deck input
